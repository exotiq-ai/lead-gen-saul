<!doctype html>
<html lang="en">
  <body style="margin:0;background:#07130f;font-family:Arial,sans-serif;color:#edf7f2">
    <table role="presentation" width="100%" cellspacing="0" cellpadding="0" style="padding:32px 16px;background:#07130f">
      <tr><td align="center">
        <table role="presentation" width="100%" cellspacing="0" cellpadding="0" style="max-width:520px;border:1px solid #214c3c;border-radius:16px;background:#0d2019;padding:32px">
          <tr><td>
            <p style="margin:0 0 16px;color:#51d6a1;font-size:12px;font-weight:700;letter-spacing:2px;text-transform:uppercase">Exotiq Command Center</p>
            <h1 style="margin:0 0 16px;font-size:26px;line-height:1.2">Your secure sign-in link</h1>
            <p style="margin:0 0 18px;color:#b9ccc4;font-size:15px;line-height:1.6">Use the button below to access the Exotiq GTM dashboard. This link is short-lived and can only be used by an approved administrator.</p>
            <p style="margin:0 0 8px;color:#78968a;font-size:12px;font-weight:700;letter-spacing:1.5px;text-transform:uppercase">One-time code</p>
            <p style="margin:0 0 24px;color:#edf7f2;font-family:monospace;font-size:30px;font-weight:700;letter-spacing:8px">{{ .Token }}</p>
            <p style="margin:0 0 24px"><a href="{{ .ConfirmationURL }}" style="display:inline-block;border-radius:8px;background:#51d6a1;color:#06110d;padding:13px 20px;font-size:15px;font-weight:700;text-decoration:none">Sign in securely</a></p>
            <p style="margin:0;color:#78968a;font-size:12px;line-height:1.5">If you did not request this link, you can safely ignore this email.</p>
          </td></tr>
        </table>
      </td></tr>
    </table>
  </body>
</html>
